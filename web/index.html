<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas Credit Exchange connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share." />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking. As a plain stylesheet this sat in front of first paint, so the page waited
         on Google before drawing anything. Loaded as print and switched to all on arrival, the
         browser fetches it without blocking; the font-display:swap in the URL already covers the
         moment before it lands. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Start the home page's two requests now, in parallel with the module bundle, instead of
         after it has downloaded, parsed and mounted React. The responses sit in the HTTP cache and
         the fetches in useEffect pick them straight up. Both are anonymous GETs, so warming them
         for a visitor who navigates elsewhere costs one cheap request and nothing else. -->
    <link rel="preload" as="fetch" href="/api/stats" />
    <link rel="preload" as="fetch" href="/api/projects?status=open&amp;sort=newest" />
    <title>Atlas Credit Exchange</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
