<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas Credit Exchange connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share." />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload then apply, with no inline script. The media="print" + onload="this.media='all'"
         trick that was here is inline script, and the deployed CSP is script-src 'self', so
         browsers enforcing it never ran the onload and the stylesheet stayed at media="print":
         the fonts silently never applied for anyone with JavaScript enabled. The preload still
         starts the fetch early, and the stylesheet below applies it whenever it arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <!-- No API preloads here. index.html is served for every SPA route, so these fired on project
         pages, the dashboard and the FAQ, where the home page never mounts and the responses are
         never read. Both endpoints scan the project table, so a home-page optimisation became
         extra backend work on unrelated visits. They also omitted crossorigin while the real
         fetches send credentials same-origin, so the request modes did not match and the browser
         was free to fetch both a second time anyway. -->
    <title>Atlas Credit Exchange</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
