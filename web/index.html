<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Relay | Donate RIPE Atlas credits to measurement research</title>
    <meta name="description" content="Atlas Relay connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share." />
    <link rel="canonical" href="https://www.atlasrelay.org/" />
    <!-- Link previews. The build copies this head into one file per kind of page and rewrites the
         title, description and URL tags for each (web/src/lib/pages.ts), so keep each tag on one
         line in this exact form. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atlas Relay" />
    <meta property="og:title" content="Atlas Relay | Donate RIPE Atlas credits to measurement research" />
    <meta property="og:description" content="Atlas Relay connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share." />
    <meta property="og:url" content="https://www.atlasrelay.org/" />
    <meta property="og:image" content="https://www.atlasrelay.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Atlas Relay home page, headed Donate spare RIPE Atlas credits to measurement research" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlas Relay | Donate RIPE Atlas credits to measurement research" />
    <meta name="twitter:description" content="Atlas Relay connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share." />
    <meta name="twitter:image" content="https://www.atlasrelay.org/og-image.png" />
    <meta name="twitter:image:alt" content="The Atlas Relay home page, headed Donate spare RIPE Atlas credits to measurement research" />
    <!-- Browsers do not execute this block, so the CSP (script-src 'self') does not block it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.atlasrelay.org/#website",
            "name": "Atlas Relay",
            "url": "https://www.atlasrelay.org/",
            "description": "Atlas Relay connects Internet researchers who need RIPE Atlas measurement credits with Atlas users who have credits to share.",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.atlasrelay.org/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.atlasrelay.org/#organization",
            "name": "Atlas Relay",
            "url": "https://www.atlasrelay.org/",
            "description": "Atlas Relay is a community project and is not affiliated with or endorsed by the RIPE NCC.",
            "sameAs": ["https://github.com/tgoodyear/atlasrelay"]
          }
        ]
      }
    </script>
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- No API preloads here. index.html is served for every SPA route, so these fired on project
         pages, the dashboard and the FAQ, where the home page never mounts and the responses are
         never read. Both endpoints scan the project table, so a home-page optimisation became
         extra backend work on unrelated visits. They also omitted crossorigin while the real
         fetches send credentials same-origin, so the request modes did not match and the browser
         was free to fetch both a second time anyway. -->
  </head>
  <body>
    <div id="root">
      <!-- static-content -->
      <section class="hero">
        <div class="container">
          <div>
            <span class="eyebrow">For RIPE Atlas users and researchers</span>
            <h1>Donate spare RIPE Atlas credits to measurement research</h1>
            <p class="lead">
              Researchers post the measurement project they are planning and the credits it needs. Atlas users with credits to spare donate them straight to the researcher's RIPE account.
            </p>
            <div class="actions">
              <a href="/projects" class="btn btn-lg btn-amber">Browse projects</a>
              <a href="/how-it-works" class="btn btn-lg btn-secondary">How it works</a>
            </div>
          </div>
        </div>
      </section>
      <!-- /static-content -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
