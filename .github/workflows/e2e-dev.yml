name: Full-flow tests on dev

# Puts this commit's site and API on dev, signs two test accounts into it through the real
# Microsoft sign-in and runs the full flow there (e2e-real/), including real RIPE Atlas transfers
# between two test accounts. The tests run in Azure, as the Container Apps job E2E_JOB_NAME, which
# reads the accounts' passwords and the RIPE Atlas keys from a Key Vault that has no public network
# access. This workflow builds the site, the API and the test image, deploys the site and the API
# to dev, starts the job, waits, and collects the redacted results. It never holds a password or a
# key. docs/RUNBOOK.md, "Full-flow tests on dev".
#
# dev is one site, one API and one set of tables. Every run, this workflow's or one started from
# a maintainer's machine with scripts/run-e2e.sh, holds one lock from before it deploys until its
# tests end (scripts/lib/e2e-job.sh, e2e-real/lib/lock.mjs), so the build under test is always the run's
# own, and two runs never use the test accounts at the same time.
#
# Only the account tgoodyear can make it run:
# - It runs after a push to main that changes the tests, or by hand. Merging to main needs write
#   access, and the "Protect main" ruleset requires a pull request with the required checks
#   passing. There is no pull request trigger of any kind, so a fork or a pull request cannot
#   start it.
# - Every job checks the repository, the actor and the branch.
# - The job that gets an Azure token runs in the GitHub Environment dev, which only main may use and
#   which waits for approval by tgoodyear (unless scripts/bootstrap.sh dev last ran with
#   --no-approval). The CI identity trusts that environment and nothing else, and holds roles in
#   dev's resource group only, so it cannot deploy anywhere else.
# - The build runs in a job of its own, without an Azure identity.
# - While dev does not exist (the repository variable DEV_ENABLED is not true), it only prints a
#   notice.
on:
  push:
    branches: [main]
    paths:
      - 'e2e-real/**'
      - 'web/e2e/ui.ts'
      - 'scripts/lib/e2e-job.sh'
      - '.github/workflows/e2e-dev.yml'
  workflow_dispatch:

# Queues the workflow's own runs. The lock (scripts/lib/e2e-job.sh) is what keeps a workflow run
# and a run started by scripts/run-e2e.sh apart: a run that finds it held waits up to 45 minutes.
concurrency:
  group: e2e-dev
  cancel-in-progress: false

permissions: {}

jobs:
  not-enabled:
    name: dev is not bootstrapped
    if: github.repository == 'tgoodyear/atlasrelay' && github.actor == 'tgoodyear' && github.ref == 'refs/heads/main' && vars.DEV_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Skip
        run: echo "::notice::The dev environment does not exist (repository variable DEV_ENABLED is not true), so there is nothing to test. scripts/bootstrap.sh dev sets it."

  # Untrusted code (npm lifecycle scripts) runs here, without any Azure identity, as in the Deploy
  # workflow. The run job deploys what this builds.
  build:
    name: Build the site and the API
    if: github.repository == 'tgoodyear/atlasrelay' && github.actor == 'tgoodyear' && github.ref == 'refs/heads/main' && vars.DEV_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      # The same build as docs/RUNBOOK.md, "Dev environment": no App Insights connection string, so
      # the test runs send no browser telemetry. DEV_SIGNIN_PROVIDERS names dev's own sign-in
      # registrations, set by scripts/bootstrap.sh dev (docs/RUNBOOK.md, "Sign-in registrations").
      # VITE_SITE_ENV=dev makes it a test site: a banner on every page, and noindex everywhere
      # (web/src/lib/siteEnv.ts).
      - name: Build
        env:
          VITE_SIGNIN_PROVIDERS: ${{ vars.DEV_SIGNIN_PROVIDERS }}
          VITE_SITE_ENV: dev
        run: |
          npm run build
          . scripts/lib/e2e-job.sh
          e2e_stage_api

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-web
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-api
          path: api.zip
          if-no-files-found: error
          retention-days: 7

  run:
    name: Deploy to dev and run the tests in Azure
    needs: build
    if: github.repository == 'tgoodyear/atlasrelay' && github.actor == 'tgoodyear' && github.ref == 'refs/heads/main' && vars.DEV_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The CI identity trusts jobs in this GitHub Environment only; scripts/bootstrap.sh restricts it
    # to main and, unless run with --no-approval, makes it wait for approval by tgoodyear.
    environment: dev
    # The image build (up to 20 minutes), up to 47 waiting for the lock, the deploy (up to 10 for the
    # API, 20 for the site, 5 for it to be served), and 55 for the execution, with a few to spare.
    timeout-minutes: 170
    permissions:
      id-token: write
      contents: read
    env:
      # Variables of the GitHub Environment dev, set by scripts/bootstrap.sh dev.
      RESOURCE_GROUP: ${{ vars.E2E_RESOURCE_GROUP }}
      JOB_NAME: ${{ vars.E2E_JOB_NAME }}
      RESULTS_ACCOUNT: ${{ vars.E2E_RESULTS_ACCOUNT }}
      RESULTS_CONTAINER: ${{ vars.E2E_RESULTS_CONTAINER }}
      LOG_WORKSPACE_ID: ${{ vars.E2E_LOG_WORKSPACE_ID }}
      REGISTRY: ${{ vars.E2E_REGISTRY }}
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # For scripts/lib/e2e-job.sh, which signs az in again with a fresh OIDC token during the run,
      # and e2e-real/lock-holder.mjs, which gets its storage tokens the same way.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      API: 2025-07-01
    steps:
      # This workflow deploys to dev and nowhere else; scripts/lib/e2e-job.sh checks the names and
      # the resources' environment tags again before it deploys.
      - name: Check the settings
        run: |
          for v in RESOURCE_GROUP JOB_NAME RESULTS_ACCOUNT RESULTS_CONTAINER LOG_WORKSPACE_ID REGISTRY SUBSCRIPTION_ID AZURE_CLIENT_ID AZURE_TENANT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is empty; run scripts/bootstrap.sh dev"; exit 1; }
          done
          [ "$RESOURCE_GROUP" = rg-atlasrelay-dev ] || { echo "::error::E2E_RESOURCE_GROUP is $RESOURCE_GROUP, not dev's"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Playwright versions agree
        run: node --test e2e-real/test/versions.test.mjs

      # Node runs e2e-real/lock-holder.mjs, which needs no packages. Nothing is installed here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-web
          path: web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-api
          path: .

      - name: Azure login (OIDC via managed identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # scripts/lib/e2e-job.sh, e2e_run: builds the test image in dev's registry (ACR Tasks, from
      # e2e-real/ and web/e2e/ui.ts at this commit; private there, and the job pulls it as the test
      # identity), takes the lock (waiting up to 45 minutes for a run that holds it), publishes the
      # API and uploads the site, starts the job with the image pinned by digest and the lease to
      # renew, waits for the execution, and releases the lock. Cancelling the run releases it too,
      # unless the job is still running; the job then keeps it until it ends.
      - name: Deploy and run the tests, holding the lock
        id: run
        run: |
          . scripts/lib/e2e-job.sh
          E2E_ENV=dev
          E2E_SUBSCRIPTION=$SUBSCRIPTION_ID
          E2E_RG=$RESOURCE_GROUP
          E2E_SWA="swa-atlasrelay-dev"
          E2E_JOB=$JOB_NAME
          E2E_REGISTRY_NAME=$REGISTRY
          E2E_RESULTS_ACCOUNT=$RESULTS_ACCOUNT
          E2E_RUN_ID="gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          E2E_SHA=$GITHUB_SHA
          E2E_IMAGE_TAG="sha-$GITHUB_SHA"
          E2E_SITE_DIR=web/dist
          E2E_API_ZIP=api.zip
          e2e_run

      # az needs a storage token here, which the sign-in at the start can no longer give it.
      - name: Download the results
        if: always() && steps.run.outputs.execution != ''
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          . scripts/lib/e2e-job.sh
          e2e_az_refresh now
          mkdir -p results
          az storage blob download-batch --auth-mode login --account-name "$RESULTS_ACCOUNT" \
            --source "$RESULTS_CONTAINER" --pattern "runs/$RUN_ID/*" --destination results \
            --only-show-errors -o none || echo "::warning::could not download the results"
          [ -f "results/runs/$RUN_ID/summary.json" ] || echo "::warning::the run uploaded no summary.json"

      # The console output is in the results when the run got that far. This covers a container that
      # never started or died early. Log Analytics takes a few minutes to receive the lines.
      - name: Read the job's logs
        if: always() && steps.run.outputs.execution != '' && steps.run.outputs.status != 'Succeeded'
        env:
          EXECUTION: ${{ steps.run.outputs.execution }}
        run: |
          . scripts/lib/e2e-job.sh
          e2e_az_refresh now
          # The platform's events only (image pulled, container started, exit code): they explain a
          # container that never started, and carry no test output. This log is public; the suite's
          # own console stays in the private results container.
          # column_ifexists: the tables' columns have changed between Container Apps versions.
          query="ContainerAppSystemLogs
            | where tostring(column_ifexists('ContainerGroupName', '')) startswith '$EXECUTION'
              or tostring(column_ifexists('ReplicaName', '')) startswith '$EXECUTION'
              or tostring(column_ifexists('ExecutionName', '')) == '$EXECUTION'
            | project TimeGenerated, Reason = tostring(column_ifexists('Reason', '')), Text = tostring(column_ifexists('Log', ''))
            | order by TimeGenerated asc"
          body="$(jq -n --arg q "$query" '{query: $q, timespan: "PT6H"}')"
          az rest --method post --resource https://api.loganalytics.io \
            --url "https://api.loganalytics.io/v1/workspaces/$LOG_WORKSPACE_ID/query" --body "$body" \
            --query 'tables[0].rows[]' -o tsv ||
            echo "::warning::could not read the job's platform events"

      # An allowlisted copy of the summary: outcome, counts, commit, run id, and each test's title and
      # outcome. No errors, URLs or file names: Playwright errors can quote the page. The repository
      # is public, so anyone signed in to GitHub can download an artifact; everything else stays in
      # the private results container, under runs/<run id>/, for the operator.
      - name: Public summary
        if: always() && steps.run.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p public
          summary="results/runs/$RUN_ID/summary.json"
          if [ -f "$summary" ]; then
            jq '{runId, status, gitSha, startedAt, finishedAt,
                 stats: (.stats // {} | {expected, unexpected, flaky, skipped}),
                 tests: [(.tests // [])[] | {title, outcome}]}' "$summary" > public/summary.json
          else
            jq -n --arg run "$RUN_ID" '{runId: $run, status: "no summary"}' > public/summary.json
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.run.outputs.run_id != ''
        with:
          name: e2e-dev-${{ steps.run.outputs.run_id }}
          path: public/summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict
        if: always() && steps.run.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          STATUS: ${{ steps.run.outputs.status }}
          SHA: ${{ github.sha }}
        run: |
          summary="results/runs/$RUN_ID/summary.json"
          {
            echo "### Full-flow tests on dev"
            echo
            echo "Execution status: ${STATUS:-unknown}"
            echo
            echo "The run deployed commit $SHA to dev and tested it there."
            if [ -f "$summary" ]; then
              jq -r '"Result: \(.status) (\(.stats.expected) passed, \(.stats.unexpected) failed, \(.stats.skipped) skipped)",
                "", "| Test | Outcome |", "| --- | --- |",
                (.tests[] | "| \(.title | gsub("\\|"; "/")) | \(.outcome) |")' "$summary"
            else
              echo "No summary.json: the run did not finish its upload. The platform events are in this run's log; the suite's console is in the private results container."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = Succeeded ] || { echo "::error::the job execution ended $STATUS"; exit 1; }
          [ "$(jq -r .status "$summary" 2> /dev/null)" = passed ] || { echo "::error::the tests did not pass"; exit 1; }
          echo "passed"
