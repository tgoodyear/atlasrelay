name: Full-flow test image

# Builds the test image (e2e-real/Dockerfile) on pull requests that change it, and checks the suite
# loads inside it. Nothing is pushed and no identity is used: e2e-dev.yml builds and pushes the image
# it runs, after the merge.
on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e-real/**'
      - 'web/e2e/ui.ts'
      - 'web/package.json'
      - '.github/workflows/e2e-image.yml'
  workflow_dispatch:

concurrency:
  group: e2e-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build the test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull -f e2e-real/Dockerfile -t atlasrelay-e2e:check .

      # --list loads the config and every spec, so a file the image is missing or an import that
      # does not resolve fails here. No test runs and nothing is contacted.
      - name: List the tests inside the image
        run: |
          docker run --rm -e BASE_URL=https://dev.atlasrelay.org --entrypoint npx atlasrelay-e2e:check \
            playwright test -c playwright.config.ts --list | tee list.txt
          grep -q 'full-flow.spec.ts' list.txt
          docker run --rm --entrypoint sh atlasrelay-e2e:check -c 'command -v zip && command -v unzip && test ! -e test && test ! -e ../web/src'
