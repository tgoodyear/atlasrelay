name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      # Only the Owner's shell scripts. scripts/indexnow.mjs runs in the indexnow job, so a change
      # to it has to trigger this workflow.
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - '**.md'
      - '.azure/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      # Only the Owner's shell scripts. scripts/indexnow.mjs runs in the indexnow job, so a change
      # to it has to trigger this workflow.
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - '**.md'
      - '.azure/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

# One deployment at a time; PR builds cancel superseded runs.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  RESOURCE_GROUP: rg-atlasrelay-prod
  SWA_NAME: swa-atlasrelay-prod
  # Set by scripts/bootstrap.sh from the Bicep outputs. Until then the workflow builds and tests only;
  # once AZURE_BOOTSTRAPPED is set, missing secrets fail the run instead of skipping silently.
  AZURE_READY: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
  AZURE_BOOTSTRAPPED: ${{ vars.AZURE_BOOTSTRAPPED == 'true' }}

jobs:
  # Untrusted code (npm lifecycle scripts, tests) runs here without any Azure identity.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      - name: Test and typecheck
        run: npm test

      # Browser telemetry (web/src/lib/telemetry.ts) is compiled in only when this is set.
      # scripts/bootstrap.sh sets the variable from the Bicep output. It is not a secret: it ends up
      # in the public JavaScript bundle either way.
      - name: Build web
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
        run: npm run build -w web

      - name: Build API
        run: npm run build -w api

      # The deploy job publishes this folder, zipped, to the Function App as it is (no remote
      # build). The API is bundled into one file (api/bundle.mjs), so the artifact is that file,
      # host.json and package.json, with no node_modules: a cold host reading three thousand small
      # files was most of the wait on a first visit.
      - name: Stage API artifact
        run: |
          rm -rf api-deploy && mkdir -p api-deploy/dist
          cp api/dist/bundle.js api/host.json api/package.json api-deploy/
          mv api-deploy/bundle.js api-deploy/dist/bundle.js
          test "$(node -p "require('./api-deploy/package.json').main")" = dist/bundle.js
          test ! -d api-deploy/node_modules
          # The project page function returns HTML built from web/dist/shell/project.html (see
          # api/bundle.mjs), so the bundle has to name this build's script file, not a stale one.
          script="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' web/dist/shell/project.html)"
          test -n "$script" && grep -qF "$script" api-deploy/dist/bundle.js
          # @azure/functions-core is supplied by the Functions worker and is the one import left
          # outside the bundle; @azure/functions runs without it here, so a plain load proves
          # everything else resolved into the file.
          cd api-deploy && node -e "require('./dist/bundle.js'); console.log('API bundle loads without node_modules')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: web/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api
          path: api-deploy
          if-no-files-found: error

  # Browser tests (web/e2e): sign-in clicks are counted and never block sign-in. Like the build job,
  # no Azure identity; the tests answer every request to App Insights, /.auth and /api themselves.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      - name: Install Chromium
        run: npx -w web playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: npm run test:e2e -w web

      # The build job runs this file too, and skips it there for want of a browser.
      - name: Check a pasted key is redacted from a real trace
        run: E2E_TRACE_TEST_REQUIRED=1 node --test e2e-real/test/trace-redaction.test.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # Full-flow tests (web/e2e/flows) against the whole application on the runner: the API bundle in
  # the Functions host, Azurite, the built site behind the Static Web Apps emulator, and a stub of the
  # RIPE Atlas API in place of atlas.ripe.net. No Azure identity and no secrets.
  flows:
    name: Full-flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Azure Functions Core Tools, from its GitHub release rather than npm (see CONTRIBUTING.md).
      # Pinned by version and by the SHA-256 of the release asset.
      FUNC_VERSION: 4.15.1
      FUNC_SHA256: 9b982efb4047c717c9b1c26beb2269c2ac41b29bf8d21f4df1130c1586cc81cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The whole lockfile: the harness runs Azurite and the SWA CLI from the root devDependencies.
      - name: Install
        run: npm ci

      - name: Install Azure Functions Core Tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/func.zip" \
            "https://github.com/Azure/azure-functions-core-tools/releases/download/${FUNC_VERSION}/Azure.Functions.Cli.linux-x64.${FUNC_VERSION}.zip"
          echo "${FUNC_SHA256}  $RUNNER_TEMP/func.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/func.zip" -d "$RUNNER_TEMP/func"
          chmod +x "$RUNNER_TEMP/func/func"
          echo "FUNC=$RUNNER_TEMP/func/func" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx -w web playwright install --with-deps --only-shell chromium

      - name: Build
        run: npm run build

      - name: Run full-flow tests
        run: npm run test:flows -w web

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: full-flow-traces
          path: |
            web/test-results
            web/e2e-stack/*.log
          retention-days: 7

  # Only this job holds an Azure identity, and only for pushes to main / manual runs. It publishes
  # the API to the Function App linked to the site first, then uploads the site, so a failed API
  # publish leaves the previous API and site in place together.
  deploy:
    name: Deploy to Azure
    needs: [build, browser, flows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The CI identity trusts jobs in this GitHub Environment only, and scripts/bootstrap.sh
    # restricts it to the main branch.
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      # 'success' only when the upload step ran and succeeded; 'skipped' before bootstrap.
      uploaded: ${{ steps.upload.outcome }}
    steps:
      - name: Azure secrets missing after bootstrap
        if: env.AZURE_READY != 'true' && env.AZURE_BOOTSTRAPPED == 'true'
        run: |
          echo "::error::AZURE_BOOTSTRAPPED is set but AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are missing; re-run scripts/bootstrap.sh"
          exit 1

      - name: Skipping deployment (Azure not bootstrapped yet)
        if: env.AZURE_READY != 'true'
        run: echo "Run scripts/bootstrap.sh to provision Azure and set the GitHub secrets."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: web
          path: web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: api
          path: api-deploy

      - name: Azure login (OIDC via managed identity)
        if: env.AZURE_READY == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The Function App that serves /api is the site's linked backend. Without one, uploading a
      # site that has no managed functions would leave /api unanswered, so the run stops here.
      - name: Find the API's Function App
        if: env.AZURE_READY == 'true'
        id: backend
        run: |
          site="/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/staticSites/$SWA_NAME"
          ids="$(az rest --method get --url "$site/linkedBackends?api-version=2024-04-01" --query "value[].properties.backendResourceId" -o tsv)"
          if [ "$(grep -c . <<< "$ids")" != 1 ] || [[ "${ids,,}" != */providers/microsoft.web/sites/* ]]; then
            echo "::error::$SWA_NAME needs exactly one linked Function App (found: ${ids:-none}); see docs/RUNBOOK.md"
            exit 1
          fi
          app="$(az rest --method get --url "$ids?api-version=2024-04-01" -o json)"
          host="$(jq -r '.properties.defaultHostName' <<< "$app")"
          scm="$(jq -r '[.properties.hostNameSslStates[] | select(.hostType == "Repository") | .name][0] // empty' <<< "$app")"
          [ -n "$host" ] && [ "$host" != null ] && [ -n "$scm" ] || { echo "::error::could not read the Function App's hostnames"; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "scm=$scm" >> "$GITHUB_OUTPUT"

      # One deploy to Flex Consumption: POST the zip to the app's publish endpoint with a Microsoft
      # Entra token (the CI role has sites/publish/Action on this app only), then wait for the
      # deployment to finish. No publishing password exists.
      - name: Publish the API
        if: env.AZURE_READY == 'true'
        env:
          SCM_HOST: ${{ steps.backend.outputs.scm }}
        run: |
          (cd api-deploy && zip -qr ../api.zip .)
          token="$(az account get-access-token --query accessToken -o tsv)"
          echo "::add-mask::$token"
          code="$(curl -sS -o publish.txt -w '%{http_code}' -X POST "https://$SCM_HOST/api/publish?RemoteBuild=false" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/zip' --data-binary @api.zip)"
          case "$code" in
            200) echo "API published"; exit 0 ;;
            202) ;;
            *) echo "::error::publish answered $code"; cat publish.txt; exit 1 ;;
          esac
          # A 202 carries the new deployment's id. Its status: 4 succeeded; 3 failed; -1 or 5
          # cancelled; 6 partly succeeded. The endpoint can miss a poll while the app restarts.
          id="$(tr -d '"[:space:]' < publish.txt)"
          [[ $id =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::publish returned no deployment id"; cat publish.txt; exit 1; }
          for _ in $(seq 1 120); do
            sleep 5
            status="$(curl -sS "https://$SCM_HOST/api/deployments/$id" -H "Authorization: Bearer $token" | jq -r '.status // empty' 2> /dev/null || true)"
            case "$status" in
              4) echo "API published"; exit 0 ;;
              3|-1|5|6) echo "::error::API deployment ended with status $status"; exit 1 ;;
            esac
          done
          echo "::error::API deployment did not finish in 10 minutes"
          exit 1

      - name: Read Static Web App deployment token
        if: env.AZURE_READY == 'true'
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      # The site only. api_location stays empty: a site with managed functions cannot keep a
      # linked backend.
      - name: Upload to Static Web Apps
        id: upload
        if: env.AZURE_READY == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # The linked identity provider must refuse anything the site did not send, including a
      # forged x-ms-client-principal. A 2xx here means the API is open to the Internet.
      - name: Direct calls to the Function App are refused
        if: env.AZURE_READY == 'true'
        env:
          API_HOST: ${{ steps.backend.outputs.host }}
        run: |
          forged="$(printf '%s' '{"identityProvider":"github","userId":"ci-check","userDetails":"ci-check","userRoles":["anonymous","authenticated"]}' | base64 -w0)"
          for path in /api/stats /api/me; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "x-ms-client-principal: $forged" "https://$API_HOST$path")"
            echo "$path: $code"
            case "$code" in
              401|403) ;;
              *) echo "::error::https://$API_HOST$path answered $code to a direct request; it should be refused"; exit 1 ;;
            esac
          done

  # Sends the live sitemap's URLs to IndexNow (Bing, Yandex and others; Google does not use it)
  # after a real deploy. It holds no Azure identity, and it can never fail the run: the site is
  # already live, the script only logs warnings, and the job is continue-on-error besides.
  indexnow:
    name: Submit URLs to IndexNow
    needs: deploy
    if: needs.deploy.outputs.uploaded == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            web/public

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Submit sitemap URLs
        run: node scripts/indexnow.mjs
