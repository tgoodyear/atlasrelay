name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - 'scripts/**'
      - '**.md'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - 'scripts/**'
      - '**.md'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

# One deployment at a time; PR builds cancel superseded runs.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  RESOURCE_GROUP: internetresearch
  SWA_NAME: swa-internetresearch
  # Set by scripts/bootstrap.sh from the Bicep outputs. Until then the workflow builds and tests only;
  # once AZURE_BOOTSTRAPPED is set, missing secrets fail the run instead of skipping silently.
  AZURE_READY: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
  AZURE_BOOTSTRAPPED: ${{ vars.AZURE_BOOTSTRAPPED == 'true' }}

jobs:
  # Untrusted code (npm lifecycle scripts, tests) runs here without any Azure identity.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      - name: Test and typecheck
        run: npm test

      - name: Build web
        run: npm run build -w web

      - name: Build API
        run: npm run build -w api

      # npm workspaces hoist the API's runtime dependencies to the repo root, and the SWA action
      # uploads api_location verbatim (skip_api_build). Stage a self-contained folder whose
      # node_modules is exactly the lockfile-pinned production tree of the api workspace.
      - name: Stage API artifact
        run: |
          rm -rf api-deploy && mkdir api-deploy
          cp -r api/dist api/host.json api/package.json api-deploy/
          npm ci -w api --omit=dev --ignore-scripts
          cp -R node_modules api-deploy/node_modules
          rm -rf api-deploy/node_modules/api api-deploy/node_modules/web api-deploy/node_modules/.bin api-deploy/node_modules/.package-lock.json
          test -d api-deploy/node_modules/@azure/functions && test -d api-deploy/node_modules/@azure/data-tables
          test ! -d api-deploy/node_modules/react
          cd api-deploy && node -e "process.env.TABLES_CONNECTION_STRING='x'; require('./dist/src/index.js'); console.log('API entry point loads')"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: web
          path: web/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: api
          path: api-deploy
          if-no-files-found: error

  # Only this job holds an Azure identity, and only for pushes to main / manual runs.
  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure secrets missing after bootstrap
        if: env.AZURE_READY != 'true' && env.AZURE_BOOTSTRAPPED == 'true'
        run: |
          echo "::error::AZURE_BOOTSTRAPPED is set but AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are missing; re-run scripts/bootstrap.sh"
          exit 1

      - name: Skipping deployment (Azure not bootstrapped yet)
        if: env.AZURE_READY != 'true'
        run: echo "Run scripts/bootstrap.sh to provision Azure and set the GitHub secrets."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: web
          path: web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: api
          path: api-deploy

      - name: Azure login (OIDC via managed identity)
        if: env.AZURE_READY == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Static Web App deployment token
        if: env.AZURE_READY == 'true'
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Upload to Static Web Apps
        if: env.AZURE_READY == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web/dist
          api_location: api-deploy
          output_location: ''
          skip_app_build: true
          skip_api_build: true
