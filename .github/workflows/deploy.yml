name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      # Only the Owner's shell scripts. scripts/indexnow.mjs runs in the indexnow job, so a change
      # to it has to trigger this workflow.
      - 'scripts/*.sh'
      - '**.md'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      # Only the Owner's shell scripts. scripts/indexnow.mjs runs in the indexnow job, so a change
      # to it has to trigger this workflow.
      - 'scripts/*.sh'
      - '**.md'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

# One deployment at a time; PR builds cancel superseded runs.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  RESOURCE_GROUP: internetresearch
  SWA_NAME: swa-internetresearch
  # Set by scripts/bootstrap.sh from the Bicep outputs. Until then the workflow builds and tests only;
  # once AZURE_BOOTSTRAPPED is set, missing secrets fail the run instead of skipping silently.
  AZURE_READY: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
  AZURE_BOOTSTRAPPED: ${{ vars.AZURE_BOOTSTRAPPED == 'true' }}

jobs:
  # Untrusted code (npm lifecycle scripts, tests) runs here without any Azure identity.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      - name: Test and typecheck
        run: npm test

      # Browser telemetry (web/src/lib/telemetry.ts) is compiled in only when this is set.
      # scripts/bootstrap.sh sets the variable from the Bicep output. It is not a secret: it ends up
      # in the public JavaScript bundle either way.
      - name: Build web
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
        run: npm run build -w web

      - name: Build API
        run: npm run build -w api

      # The SWA action uploads api_location verbatim (skip_api_build). The API is bundled into one
      # file (api/bundle.mjs), so the artifact is that file, host.json and package.json, with no
      # node_modules: a cold host reading three thousand small files off a network share was most
      # of the wait on a first visit.
      - name: Stage API artifact
        run: |
          rm -rf api-deploy && mkdir -p api-deploy/dist
          cp api/dist/bundle.js api/host.json api/package.json api-deploy/
          mv api-deploy/bundle.js api-deploy/dist/bundle.js
          test "$(node -p "require('./api-deploy/package.json').main")" = dist/bundle.js
          test ! -d api-deploy/node_modules
          # The project page function returns HTML built from web/dist/shell/project.html (see
          # api/bundle.mjs), so the bundle has to name this build's script file, not a stale one.
          script="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' web/dist/shell/project.html)"
          test -n "$script" && grep -qF "$script" api-deploy/dist/bundle.js
          # @azure/functions-core is supplied by the Functions worker and is the one import left
          # outside the bundle; @azure/functions runs without it here, so a plain load proves
          # everything else resolved into the file.
          cd api-deploy && node -e "process.env.TABLES_CONNECTION_STRING='x'; require('./dist/bundle.js'); console.log('API bundle loads without node_modules')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: web/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api
          path: api-deploy
          if-no-files-found: error

  # Browser tests (web/e2e): sign-in clicks are counted and never block sign-in. Like the build job,
  # no Azure identity; the tests answer every request to App Insights, /.auth and /api themselves.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (api + web workspaces only)
        run: npm ci -w api -w web

      - name: Install Chromium
        run: npx -w web playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: npm run test:e2e -w web

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # Only this job holds an Azure identity, and only for pushes to main / manual runs.
  deploy:
    name: Deploy to Azure Static Web Apps
    needs: [build, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      # 'success' only when the upload step ran and succeeded; 'skipped' before bootstrap.
      uploaded: ${{ steps.upload.outcome }}
    steps:
      - name: Azure secrets missing after bootstrap
        if: env.AZURE_READY != 'true' && env.AZURE_BOOTSTRAPPED == 'true'
        run: |
          echo "::error::AZURE_BOOTSTRAPPED is set but AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are missing; re-run scripts/bootstrap.sh"
          exit 1

      - name: Skipping deployment (Azure not bootstrapped yet)
        if: env.AZURE_READY != 'true'
        run: echo "Run scripts/bootstrap.sh to provision Azure and set the GitHub secrets."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: web
          path: web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.AZURE_READY == 'true'
        with:
          name: api
          path: api-deploy

      - name: Azure login (OIDC via managed identity)
        if: env.AZURE_READY == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Static Web App deployment token
        if: env.AZURE_READY == 'true'
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Upload to Static Web Apps
        id: upload
        if: env.AZURE_READY == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web/dist
          api_location: api-deploy
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  # Sends the live sitemap's URLs to IndexNow (Bing, Yandex and others; Google does not use it)
  # after a real deploy. It holds no Azure identity, and it can never fail the run: the site is
  # already live, the script only logs warnings, and the job is continue-on-error besides.
  indexnow:
    name: Submit URLs to IndexNow
    needs: deploy
    if: needs.deploy.outputs.uploaded == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            web/public

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Submit sitemap URLs
        run: node scripts/indexnow.mjs
