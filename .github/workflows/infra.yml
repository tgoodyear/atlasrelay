name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: internetresearch
  BUDGET_CONTACT_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL || 'trevor.goodyear@gmail.com' }}

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Budget period start
        run: echo "BUDGET_START_DATE=$(date -u +%Y-%m-01)" >> "$GITHUB_ENV"

      - name: What-if (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Deploy (main)
        if: github.event_name != 'pull_request'
        run: |
          az deployment group create \
            --name "infra-${GITHUB_SHA::7}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam
