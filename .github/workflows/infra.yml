name: Infrastructure

# Checks only. The environment's deployment stack (infra/main.bicep) is deployed by a
# subscription Owner with scripts/bootstrap.sh or scripts/provision.sh, never from CI.
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.azure/env.example'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.azure/env.example'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint Bicep and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every warning fails the build: bicep lint exits 0 on warnings, so its diagnostics are
      # counted. Other lines (an upgrade notice from az) are printed and ignored.
      - name: Build and lint the templates
        run: |
          status=0
          for f in infra/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
            out="$(az bicep lint --file "$f" 2>&1)" || status=1
            [ -z "$out" ] || echo "$out"
            if grep -qE ': (Warning|Error) ' <<< "$out"; then status=1; fi
          done
          exit $status

      - name: Check the parameters and settings
        run: scripts/check-params.sh

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh
