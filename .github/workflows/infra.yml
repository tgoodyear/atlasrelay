name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: internetresearch
  BUDGET_CONTACT_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL || 'trevor.goodyear@gmail.com' }}
  # Until scripts/bootstrap.sh has created the federated credential and secrets,
  # this workflow only lints the template instead of failing.
  AZURE_READY: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Skipping deployment (Azure secrets not configured yet)
        if: env.AZURE_READY != 'true'
        run: echo "Run scripts/bootstrap.sh to create the OIDC credential and GitHub secrets."

      - name: Azure login (OIDC)
        if: env.AZURE_READY == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Budget period start
        if: env.AZURE_READY == 'true'
        run: echo "BUDGET_START_DATE=$(date -u +%Y-%m-01)" >> "$GITHUB_ENV"

      - name: What-if (pull requests)
        if: env.AZURE_READY == 'true' && github.event_name == 'pull_request'
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Deploy (main)
        if: env.AZURE_READY == 'true' && github.event_name != 'pull_request'
        run: |
          az deployment group create \
            --name "infra-${GITHUB_SHA::7}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam
