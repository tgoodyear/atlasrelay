version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # TypeScript 7 removes compiler options this project uses (moduleResolution: node);
      # take that upgrade deliberately, not as part of a routine bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
